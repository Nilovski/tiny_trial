# Tiny Tapeout project information
project:
  title:        "2x2 integer output-stationary systolic GEMM (bring-up)"
  author:       "Sahpar Nil Ozer, Hasan Unlu"
  discord:      ""
  description:  "Byte-serial host interface (LOAD_A/LOAD_B/CLEAR_GEMM/READ_C_ELEMENT/STATUS/ID) driving a 2x2 output-stationary integer systolic array. Bring-up stage ahead of the 8x8 BF16 accelerator."
  language:     "SystemVerilog"
  clock_hz:     10000000

  # A single tile is about 167x108 uM. Raw synthesized standard-cell area for
  # this design is 37,153 um^2 -- already >2x one tile before routing/tap/
  # decap overhead. 2x2 (4 tiles) below is a placeholder pending a real
  # hardening run; it may need to go up to 3x2/4x2.
  # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2
  tiles: "2x2"

  # Your top module name must start with "tt_um_". Made unique with a github username-style tag:
  top_module:  "tt_um_sahpar_gemm2x2"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_sahpar_gemm2x2.sv"
    - "rx_byte_interface.sv"
    - "tx_byte_interface.sv"
    - "cmd_decoder_2x2.sv"
    - "gemm_top.sv"
    - "systolic_array.sv"
    - "pe.sv"
    - "mac_unit.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "host_data_in[0]"
  ui[1]: "host_data_in[1]"
  ui[2]: "host_data_in[2]"
  ui[3]: "host_data_in[3]"
  ui[4]: "host_data_in[4]"
  ui[5]: "host_data_in[5]"
  ui[6]: "host_data_in[6]"
  ui[7]: "host_data_in[7]"

  # Outputs
  uo[0]: "host_data_out[0]"
  uo[1]: "host_data_out[1]"
  uo[2]: "host_data_out[2]"
  uo[3]: "host_data_out[3]"
  uo[4]: "host_data_out[4]"
  uo[5]: "host_data_out[5]"
  uo[6]: "host_data_out[6]"
  uo[7]: "host_data_out[7]"

  # Bidirectional pins
  uio[0]: "RX_VALID"
  uio[1]: "RX_READY"
  uio[2]: "TX_READY"
  uio[3]: "TX_VALID"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
